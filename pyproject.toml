[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "predictguard"
version = "0.1.0"
description = "Remaining useful life prediction and maintenance cost analysis."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "matplotlib==3.10.3",
    "numpy==2.3.2",
    "pandas==2.3.2",
    "PyYAML==6.0.2",
    "scikit-learn==1.6.1",
    "torch==2.14.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]
api = [
    "fastapi==0.135.1",
    "uvicorn==0.52.4",
    "httpx==0.28.1",
]
notebook = [
    "ipykernel==6.29.5",
    "jupyter==1.1.1",
    "nbconvert==7.17.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
