seed: 42
device: auto

data:
  root: data/raw
  subset: FD001
  train_file: train_FD001.txt
  test_file: test_FD001.txt
  rul_file: RUL_FD001.txt

split:
  validation_fraction: 0.2
  random_state: 42
  group_column: unit_id

window:
  size: 30

training:
  seeds:
    - 42
    - 43
    - 44
  max_epochs: 100
  batch_size: 64
  early_stopping:
    monitor: validation_mae_cycles
    patience: 10
    min_delta_cycles: 0.0
    restore_best_checkpoint: true
  loss:
    name: huber
    delta_cycles: 1.0
  optimizer:
    name: adam
    learning_rate: 0.001

evaluation:
  primary_metric: mae_cycles
  validation_windows: all_complete_windows
  test_policy: reserve_until_model_selection_is_complete
  report_raw_predictions: true
  latency_percentiles:
    - 50
    - 95

baseline:
  name: median_train_rul
  target_source: training_window_labels

features:
  include_cycle: true
  include_operating_settings: true
  sensors: all
  exclude_unit_id: true

preprocessing:
  output_root: artifacts/processed/fd001
  constant_variance_threshold: 1.0e-12
  drop_constant_sensors: true
  train_window_stride: 1

models:
  candidates:
    - mlp
    - lstm

business:
  baseline_policy: null
  cost_assumptions: null
  sensitivity_fractions:
    - 0.2
    - 0.5
