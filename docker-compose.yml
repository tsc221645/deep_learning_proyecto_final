services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      PREDICTGUARD_DEVICE: ${PREDICTGUARD_DEVICE:-cpu}
      PREDICTGUARD_TORCH_THREADS: ${PREDICTGUARD_TORCH_THREADS:-2}
      PREDICTGUARD_LOG_LEVEL: INFO
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-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}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
    ports:
      - "${PREDICTGUARD_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${PREDICTGUARD_WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
